name: Multi-OS Host Tests

on:
  workflow_dispatch:
  push:
    branches:
      - feat/multi-platform-host
      - main
      - audit/release-quality-v1
  pull_request:

jobs:
  test-matrix:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python test/runtime dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install paramiko pyserial pytest

      - name: Run offline unit, safety, and cross-platform tests
        run: python -m pytest -v

      - name: Verify preflight and list-packs on Unix shells
        if: runner.os != 'Windows'
        run: |
          bash -n scripts/bootstrap.sh
          python scripts/kit.py fetch-assets --list-packs
          python scripts/kit.py preflight

      - name: Verify preflight and list-packs on Windows
        if: runner.os == 'Windows'
        run: |
          python scripts\kit.py fetch-assets --list-packs
          python scripts\kit.py preflight

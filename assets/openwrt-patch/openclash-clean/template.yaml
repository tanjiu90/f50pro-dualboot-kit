# Generic sanitized Mihomo / OpenClash starter profile (zero proxy nodes / secrets).
# Import your own subscription URL or proxy list in OpenClash -> Config Subscribe / File Manage.
mixed-port: 7893
allow-lan: true
bind-address: '*'
mode: rule
log-level: warning
ipv6: false
external-controller: 0.0.0.0:9090
external-ui: ui

profile:
  store-selected: true
  store-fake-ip: false

dns:
  enable: true
  listen: 0.0.0.0:7874
  ipv6: false
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  default-nameserver:
    - 223.5.5.5
    - 119.29.29.29
  nameserver:
    - https://doh.pub/dns-query
    - https://dns.alidns.com/dns-query

proxies: []

proxy-groups:
  - name: PROXY
    type: select
    proxies:
      - DIRECT

rules:
  - GEOIP,PRIVATE,DIRECT,no-resolve
  - GEOIP,CN,DIRECT
  - MATCH,DIRECT
